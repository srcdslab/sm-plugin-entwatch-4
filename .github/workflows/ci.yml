name: CI

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'addons/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'addons/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SourcePawn compiler
        uses: rumblefrog/setup-sp@v1.3.1
        with:
          version: "1.12.x"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          set -euo pipefail
          mkdir -p addons/sourcemod/scripting/include deps
          git clone --depth=1 https://github.com/Bara/Multi-Colors.git deps/multicolors
          cp -R deps/multicolors/addons/sourcemod/scripting/include/* addons/sourcemod/scripting/include/

      # Only entWatch-4.sp is a standalone plugin; the ew4/*.inc and classes/*.inc
      # files are #include'd by it and do not compile on their own. The `::error`
      # annotation surfaces a failure inline on the PR's Files Changed view.
      - name: Build sourcemod plugin
        working-directory: addons/sourcemod/scripting
        run: |
          set -euo pipefail
          mkdir -p ../plugins
          echo "::group::Compiling entWatch-4.sp"
          # spcomp exits 0 even when it only emits warnings, so capture the output
          # and fail the build if any warning is present (warnings-as-errors).
          set +e
          spcomp -i include -o ../plugins/entWatch-4.smx entWatch-4.sp 2>&1 | tee spcomp.log
          status=${PIPESTATUS[0]}
          set -e
          echo "::endgroup::"
          if [ "$status" -ne 0 ]; then
            echo "::error file=addons/sourcemod/scripting/entWatch-4.sp::Failed to compile entWatch-4.sp"
            exit 1
          fi
          if grep -Eq '\bwarning\b' spcomp.log; then
            echo "::error file=addons/sourcemod/scripting/entWatch-4.sp::Compiler emitted warnings (treated as errors)"
            grep -E '\bwarning\b' spcomp.log || true
            exit 1
          fi

      - name: Create package
        run: |
          set -euo pipefail
          mkdir -p /tmp/package/addons/sourcemod
          cp -R addons/sourcemod/plugins /tmp/package/addons/sourcemod/
          cp -R addons/sourcemod/configs /tmp/package/addons/sourcemod/
          cp -R addons/sourcemod/gamedata /tmp/package/addons/sourcemod/
          cp -R addons/sourcemod/translations /tmp/package/addons/sourcemod/

      - name: Upload build archive for test runners
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: /tmp/package

  tag:
    name: Tag
    needs: build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete existing "latest" release and tag
        run: |
          set -euo pipefail
          gh release delete latest --cleanup-tag --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: rickstaa/action-create-tag@v1
        with:
          tag: latest
          github_token: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release
    needs: [build, tag]
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.tag.result == 'success' || needs.tag.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ runner.os }}
          path: artifacts

      - name: Versioning
        run: |
          set -euo pipefail
          version="latest"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Package
        run: |
          set -euo pipefail
          cd artifacts
          tar -czf "../${{ github.event.repository.name }}-${{ env.RELEASE_VERSION }}.tar.gz" .
          cd ..

      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "*.tar.gz"
          tag: ${{ env.RELEASE_VERSION }}
          file_glob: true
          overwrite: true
